[package]
name = "qplay_native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_qml"] }
libloading = "=0.8.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"
serde_json = "=1.0.145"
