[package]
name = "qplay_native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_qml"] }
libloading = "=0.8.9"
qbutt-codex = { git = "https://github.com/qbutt-org/qbutt.git", rev = "6a1f380171279ec7226857ebd0b3cd95bba1445f" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
subcue = "=0.1.1"
matroska-demuxer = { version = "=0.8.1", path = "vendor/matroska-demuxer" }
thiserror = "=2.0.17"
tokio = { version = "=1.53.2", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"
serde_json = "=1.0.145"
